# aaoifi_thresholds.yaml
# عتبات مرجعية لفرز الأسهم المتوافقة شرعًا.
# تعكس هذه القيم التنفيذ في src/sharia_ai/screening/rules.py
# وهي مُقدَّمة هنا بصيغة YAML للتكامل مع أنظمة أخرى
# (مثل لوحة تحكم للتهيئة، تدقيق خارجي) دون الحاجة لاستيراد بايثون.
#
# تنبيه: تعديل هذه القيم لا يؤثر تلقائيًا على كود بايثون —
# راجع docs/architecture.md، قسم "التهيئة الخارجية" للاطلاع على
# مثال محمّل YAML -> ScreeningThresholds.
#
# المؤلف: Ciprian Ștefan Pleșca

business_screening:
  max_haram_revenue_ratio: 0.05

financial_ratios:
  max_debt_to_market_cap: 0.33
  max_cash_interest_to_market_cap: 0.33
  max_receivables_to_market_cap: 0.49

purification:
  purification_threshold: 0.05

excluded_sectors:
  - alcohol
  - gambling
  - conventional_banking
  - conventional_insurance
  - pork
  - adult_entertainment
  - tobacco
  - weapons_controversial
  - media_immoral

zakat:
  rate: 0.025
  nisab_gold_grams: 85.0
  nisab_silver_grams: 595.0

metadata:
  methodology_references:
    - "معيار الشريعة رقم 21 لهيئة AAOIFI (الأوراق المالية - الأسهم/السندات)"
    - "منهجية مؤشر داو جونز الإسلامي (DJIM)"
    - "قواعد سلسلة مؤشرات FTSE Shariah العالمية للأسهم"
  disclaimer: >
    تمثّل هذه العتبات تفسيرات منهجية شائعة في الصناعة، وليست فتوى.
    يتطلب الاستخدام المؤسسي التحقق من قبل هيئة رقابة شرعية معتمدة.
