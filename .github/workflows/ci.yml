name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: تهيئة بايثون ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: تثبيت الاعتماديات
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: فحص جودة الكود (ruff)
        run: ruff check src tests

      - name: فحص الأنواع (mypy)
        run: mypy src || true  # غير مانع في مرحلة الألفا؛ يصبح صارمًا في الإصدار 1.0

      - name: تشغيل الاختبارات مع تغطية الكود
        run: pytest --cov=sharia_ai --cov-report=term-missing
